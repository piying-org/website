<div
  class="drawer mx-auto"
  [class.xl:drawer-open]="drawerOpen$()"
  [class.xl:max-w-[100rem]]="drawerOpen$()"
>
  <input
    id="drawer-open-1"
    type="checkbox"
    class="drawer-toggle"
    #drawerToggleEl
  />
  <div class="drawer-content flex flex-col min-h-[100vh]">
    <div class="sticky top-0 z-30">
      <div class="alert alert-warning">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6 shrink-0 stroke-current"
          fill="none"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
          />
        </svg>
        <div class="flex flex-col">
          <span>
            请访问最新的文档网站：
            <a
              href="https://piying-org.github.io/piying-view/zh"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://piying-org.github.io/piying-view/zh
            </a>
          </span>
          <span>
            Please visit the latest documentation site:
            <a
              href="https://piying-org.github.io/piying-view/en"
              target="_blank"
              rel="noopener noreferrer"
            >
              https://piying-org.github.io/piying-view/en
            </a>
          </span>
        </div>
      </div>
      <div class="navbar bg-base-100 shadow-sm">
        <label
          for="drawer-open-1"
          class="btn btn-square btn-ghost"
          [class.lg:hidden]="drawerOpen$()"
        >
          <mat-icon>menu</mat-icon>
        </label>
        @if (toolbar$$(); as toolbar) {
          <ng-container
            *ngTemplateOutlet="
              fieldTemplateRef;
              context: { $implicit: toolbar }
            "
          ></ng-container>
        }
      </div>
    </div>
    <div class="px-6 pb-16 flex-1">
      <router-outlet></router-outlet>
    </div>
  </div>
  <div class="drawer-side z-99 top-0" [class.xl:sticky]="drawerOpen$()">
    <label
      for="drawer-open-1"
      aria-label="close sidebar"
      class="drawer-overlay"
    ></label>

    <app-navigation
      class="min-h-full block bg-base-200 p-4"
      [navigation]="navList"
    ></app-navigation>
  </div>
</div>
